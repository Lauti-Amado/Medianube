<form class="w-full flex flex-col" onsubmit="event.preventDefault(); window.location.href='/dashboard';">

<div class="flex flex-col mb-space-12">
<label class="font-label-medium text-label-medium text-text-secondary mb-space-4" for="email">Email</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-input border border-border rounded-lg px-space-10 py-space-8 font-body-default text-body-default text-text-primary placeholder:text-text-muted outline-none focus:border-accent transition-colors" id="email" placeholder="horno@panaderia.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col mb-space-8">
<div class="flex items-center justify-between mb-space-4">
<label class="font-label-medium text-label-medium text-text-secondary" for="password">Contraseña</label>
<a class="font-caption text-caption text-text-secondary hover:text-accent transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-input border border-border rounded-lg px-space-10 py-space-8 font-body-default text-body-default text-text-primary placeholder:text-text-muted outline-none focus:border-accent transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<span class="material-symbols-outlined text-[16px]">arrow_forward</span>

<span class="font-caption text-caption text-text-muted lowercase">o</span>
<div class="flex-1 h-[1px] bg-border-divider"></div>
