<div class="w-full max-w-[340px] bg-surface rounded-xl p-[30px] flex flex-col items-center border border-border">
<!-- Brand Lockup -->
<div class="flex flex-col items-center mb-space-20">
<div class="w-[52px] h-[52px] rounded-full bg-accent-tint border border-border-strong flex items-center justify-center overflow-hidden mb-space-8">
<img alt="Medianube Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmlDUbrnwCwGN9npy6hAz-jyLi5aZLwmTY2kb4qfPOgCxnXaeUEAf0PTzqYV8ymnaUMSUVVRV4zH85U0rae9ky6GrasYInpJbbKoTuQ_SUzCDzsfWzD8acn9KbzU292Fad1I-pB8TdyXnpExqq0en5p4PqKZqjpYLScmEYpGEHytSE9KZO9B0Jtoc0H_ZHMc0dytfjpNerAy9Cep23JHLmKqKeLSuuQrh6iZZue0EPPoMb99-r5SlIQ1U8OkFjFjb5qQ"/>
</div>
<span class="font-brand-mark text-brand-mark text-text-primary tracking-wide lowercase">medianube</span>
</div>
<!-- Segmented Progress Bar (Paso 1 de 3 activo) -->
<div class="w-full grid grid-cols-3 gap-space-6 mb-space-24">
<div class="h-[4px] rounded-full bg-accent"></div>
<div class="h-[4px] rounded-full bg-border-divider"></div>
<div class="h-[4px] rounded-full bg-border-divider"></div>
</div>
<!-- Screen Headings -->
<div class="w-full text-left mb-space-20">
<h1 class="font-headline-screen text-headline-screen text-text-primary mb-space-4">Contanos sobre tu panadería</h1>
<p class="font-body-default text-body-default text-text-secondary leading-tight">Esto ayuda a personalizar tus precios y predicciones de demanda.</p>
</div>
<!-- Form Container -->
<form class="w-full flex flex-col gap-space-16" id="onboarding-form" onsubmit="event.preventDefault(); window.location.href='/dashboard';">
<!-- Business Name -->
<div class="flex flex-col w-full">
<label class="font-label-default text-label-default text-text-secondary mb-space-6" for="business_name">
          Nombre del negocio
        </label>
<input class="w-full bg-surface-input text-text-primary border border-border rounded-lg px-space-12 py-[10px] font-body-default text-body-default placeholder:text-text-muted focus:border-accent focus:outline-none transition-colors" id="business_name" name="business_name" placeholder="panadería medianube" type="text" value="Panadería La Medialuna Dorada"/>
</div>
<!-- Categories Chips -->
<div class="flex flex-col w-full">
<label class="font-label-default text-label-default text-text-secondary mb-space-8">
          Tipo de establecimiento
        </label>
<div class="flex flex-wrap gap-space-6" id="category-chips">
<button class="chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-accent text-on-primary border-none cursor-pointer" data-value="panaderia" type="button">
            panadería
          </button>
<button class="chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-surface text-text-primary border border-border hover:bg-surface-bright cursor-pointer" data-value="pasteleria" type="button">
            pastelería
          </button>
<button class="chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-surface text-text-primary border border-border hover:bg-surface-bright cursor-pointer" data-value="cafeteria" type="button">
            cafetería
          </button>
<button class="chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-surface text-text-primary border border-border hover:bg-surface-bright cursor-pointer" data-value="mixto" type="button">
            mixto
          </button>
</div>
</div>
<!-- 2-Column Inputs: Sucursales & Moneda -->
<div class="grid grid-cols-2 gap-space-12 w-full">
<div class="flex flex-col">
<label class="font-label-default text-label-default text-text-secondary mb-space-6" for="branches">
            Sucursales
          </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-input text-text-primary border border-border rounded-lg px-space-12 py-[10px] font-body-default text-body-default focus:border-accent focus:outline-none transition-colors" id="branches" min="1" name="branches" type="number" value="1"/>
<span class="material-symbols-outlined absolute right-space-8 text-text-muted text-[18px] pointer-events-none">storefront</span>
</div>
</div>
<div class="flex flex-col">
<label class="font-label-default text-label-default text-text-secondary mb-space-6">
            Moneda
          </label>
<div class="w-full bg-neutral-badge-bg/50 border border-border rounded-lg px-space-12 py-[10px] flex items-center justify-between cursor-not-allowed">
<span class="font-body-emphasis text-body-emphasis text-text-callout">$ ARS</span>
<span class="font-caption text-caption text-text-muted">Fija</span>
</div>
</div>
</div>
<!-- Contextual Assistant Callout -->
<div class="w-full bg-accent-tint border border-border rounded-lg p-space-10 flex items-start gap-space-8 mt-space-4">
<span class="material-symbols-outlined text-accent-dark text-[18px] shrink-0 mt-[1px]">arrow_back_ios_new</span>
<p class="font-caption text-caption text-text-callout leading-snug">
          Ajustaremos los algoritmos de costos e inflación según los índices del sector en Argentina.
        </p>
</div>
<!-- Primary Action -->
<div class="flex flex-col w-full gap-space-12 pt-space-8">
<button class="w-full bg-accent hover:bg-accent-dark text-on-primary font-body-emphasis text-body-emphasis rounded-lg py-[11px] px-space-14 flex items-center justify-center gap-space-8 transition-colors cursor-pointer" type="submit">
<span>Continuar</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Skip Link -->
<a class="w-full text-center font-caption-medium text-caption-medium text-text-secondary hover:text-text-primary transition-colors py-space-4" href="/dashboard">
          omitir por ahora
        </a>
</div>
</form>
</div>
<script>
    (function() {
      const chipButtons = document.querySelectorAll('#category-chips .chip-btn');
      chipButtons.forEach(button => {
        button.addEventListener('click', () => {
          chipButtons.forEach(btn => {
            btn.className = 'chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-surface text-text-primary border border-border hover:bg-surface-bright cursor-pointer';
          });
          button.className = 'chip-btn px-[14px] py-[6px] rounded-full font-label-medium text-label-medium transition-all bg-accent text-on-primary border-none cursor-pointer';
        });
      });
    })();
  </script>
</div></main></body></html>
